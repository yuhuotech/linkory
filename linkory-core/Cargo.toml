[package]
name = "linkory-core"
version = "0.1.0"
edition = "2021"
description = "Linkory core: same-network direct transfer (LNK1) reference implementation"
license = "UNLICENSED"

[lib]
name = "linkory_core"
path = "src/lib.rs"

[[bin]]
name = "linkory-lan"
path = "src/main.rs"

[dependencies]
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
subtle = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
opt-level = 3
